name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install game dependencies
        working-directory: game
        run: npm ci
      - name: Typecheck
        working-directory: game
        run: npx tsc --noEmit
      - name: Run game unit tests
        working-directory: game
        run: npm test -- --run
      - name: Run party-relay tests
        run: node --test tools/party-relay/relay.test.mjs
